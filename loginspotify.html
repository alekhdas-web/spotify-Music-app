<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in spotify</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"> 

</head>
<body>
<form action="">
    <div class="log-in--page">
     <div class="log-in">
        <div class="link--for--log-in">
         <header>
            <a href="../index.html"><i class="fa-brands fa-spotify"></i></a>
         </header>

    <div class="log-in-spotify">
        <h1>Log in to spotify</h1>
    </div> 
    <div class="email-password-button">
        <div class="form">
            <div class="email-password">
                <div class="email-text">
        <label for="email">Enter or Username</label>
        <input type="email" name="email" placeholder="Email or Username">
                </div>
                <div class="password-text">
                    <label for="password">password</label>
                    <input type="password" placeholder="password">
                </div>
            </div>
            <button type="submit" onclick="SubmitEvent" value="log-in">Log In</button>
        <div class="check">
            <input type="checkbox">
            <span>Remember Me.</span>
        </div>
        </div>
    </div>
        <div class="text-in-footer">
            <span>Dont have a account? <a href="./sign-up.html">sign up for spotify</a></span>
        </div>
        </div>
     </div>   
    </div>
</form>  
</body>
</html>
